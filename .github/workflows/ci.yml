name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test --ci --coverage
      - run: pnpm fingerprint
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # TODO (native build validation): the Android and iOS debug-build jobs were removed on 2026-10-12 to save
  # runner minutes (iOS runs on macOS at 10x billing). Reinstate them as a separate `native-build.yml`
  # triggered only by native-affecting paths (android/**, ios/**, package.json, pnpm-lock.yaml,
  # .runtime-fingerprint, babel/metro config) plus workflow_dispatch. See docs/CI_CD.md.
