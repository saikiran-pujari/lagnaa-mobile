name: Android release (AAB)

on:
  push:
    tags: ['v*']

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Firebase config (prod)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_PROD != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_PROD }}" | base64 -d > android/app/src/prod/google-services.json
      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleProdRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lagnaa-${{ github.ref_name }}-prod.aab
          path: |
            android/app/build/outputs/bundle/prodRelease/*.aab
            android/app/build/outputs/mapping/prodRelease/mapping.txt
      # Upload to Play Console is a manual step by a release manager (docs/RELEASE_ARCHITECTURE.md).
