name: OTA release (Phase 2)

# Scaffold only. Becomes active when hot-updater is integrated (docs/OTA_ARCHITECTURE.md).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Target channel
        required: true
        type: choice
        options: [development, staging, production]
      rollout:
        description: Rollout percentage (production only)
        default: '10'

jobs:
  publish:
    if: ${{ vars.OTA_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm fingerprint
      - name: Publish bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: echo "pnpm hot-updater deploy --channel ${{ inputs.channel }} --rollout ${{ inputs.rollout }} # wired in Phase 2"
